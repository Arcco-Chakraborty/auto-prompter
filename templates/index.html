<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Prompter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Auto Prompter</h1>
  <p class="note">Prompts fire only while <code>python app.py</code> is running.</p>

  <section class="card">
    <h2>New scheduled prompt</h2>
    <form id="job-form">
      <label>Prompt
        <textarea name="prompt" rows="3" required></textarea>
      </label>

      <fieldset>
        <legend>Target</legend>
        <label><input type="radio" name="target_type" value="new" checked> New chat in folder</label>
        <div class="folder-row">
          <input type="text" name="folder" placeholder="/absolute/path/to/project">
          <button type="button" id="browse-btn">Browse…</button>
        </div>
        <div id="browser" class="browser" hidden>
          <div class="browser-header">
            <div class="browser-path" id="browser-path"></div>
            <button type="button" id="browser-close" class="browser-close-btn"
                    aria-label="Close folder browser">Close</button>
          </div>
          <div id="browser-drives" class="browser-drives"></div>
          <ul id="browser-list"></ul>
          <div class="browser-actions">
            <button type="button" id="browser-select">Select this folder</button>
            <button type="button" id="browser-cancel">Cancel</button>
          </div>
        </div>
        <label><input type="radio" name="target_type" value="existing"> Existing chat</label>
        <select name="session"></select>
        <button type="button" id="refresh-sessions">Refresh chats</button>
      </fieldset>

      <fieldset>
        <legend>Claude CLI Settings</legend>
        <div class="session-settings-row">
          <label class="toggle-label">
            <input type="checkbox" name="inherit_session_settings" checked>
            <span>Auto-fill settings from selected existing chat</span>
          </label>
          <button type="button" id="apply-session-settings">Apply detected settings</button>
        </div>
        <p id="session-settings-preview" class="settings-preview">
          Select an existing chat to detect its permission mode and model.
        </p>
        <div class="settings-grid">
          <label>Permission mode
            <select name="permission_mode">
              <option value="">Use Claude default</option>
              <option value="default">Default</option>
              <option value="acceptEdits">Accept edits</option>
              <option value="auto">Auto</option>
              <option value="dontAsk">Don't ask</option>
              <option value="plan">Plan</option>
              <option value="bypassPermissions">Dangerously skip permissions</option>
            </select>
          </label>
          <label class="toggle-label">
            <input type="checkbox" name="verbose">
            <span>--verbose</span>
          </label>
          <label>Model
            <input type="text" name="model" placeholder="e.g. sonnet or a full model ID">
          </label>
          <label>Run timeout (seconds)
            <input type="number" name="timeout_seconds" value="3600" min="1" max="86400">
          </label>
          <label>Extra CLI flags
            <input type="text" name="extra_flags" placeholder="e.g. --output-format json">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Schedule</legend>
        <label><input type="radio" name="sched_type" value="once" checked> One-time</label>
        <input type="datetime-local" name="run_at">
        <label><input type="radio" name="sched_type" value="recurring"> Recurring</label>
        <select id="cron-preset">
          <option value="">— preset —</option>
          <option value="0 9 * * *">Every day at 09:00</option>
          <option value="0 * * * *">Every hour</option>
          <option value="*/30 * * * *">Every 30 minutes</option>
          <option value="0 9 * * 1">Every Monday at 09:00</option>
        </select>
        <input type="text" name="cron" placeholder="raw cron e.g. 0 9 * * *">
      </fieldset>

      <button type="submit">Schedule prompt</button>
      <span id="form-error" class="error"></span>
    </form>
  </section>

  <section class="card">
    <h2>Scheduled prompts</h2>
    <table id="jobs-table">
      <thead><tr><th>Prompt</th><th>Target</th><th>Next run</th><th>Status</th><th>Last run</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <h2>Existing chats</h2>
    <ul id="sessions-list"></ul>
  </section>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
